name: Comment Lint

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: comment-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  comment-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint production comments
        run: bash .github/workflows/ci/lint/comment-lint.sh
