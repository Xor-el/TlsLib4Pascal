      - name: Build (Solaris x86_64)
        uses: vmactions/solaris-vm@v1
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['solaris'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['solaris'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        with:
          envs: FPC_VERSION LAZARUS_BRANCH LAZARUS_REPO MAKE_BUILD_BACKEND MAKE_PACKAGE_SCOPE MAKE_DEFINES MAKE_RUN_BENCHMARK MAKE_TEST_REPEAT MAKE_LAZBUILD_GUI FPC_TARGET FPC_TARBALL_TARGET CI_DEBUG MAKE_RUN_INTEROP MAKE_RUN_BOGO MAKE_RUN_OPENSSL MAKE_RUN_TRUST MAKE_RUN_AUTOROOT MAKE_RUN_FCLNET MAKE_CRYPTO_PROVIDER MAKE_PKIX_PROVIDER TLSLIB_TEST_NETWORK BOGO_REF
          release: "11.4-gcc"
          prepare: sh .github/workflows/ci/vm-solaris-prepare.sh
          run: bash .github/workflows/ci/vm-run-shared.sh

      - name: Pull BoGo coverage boundary from the VM
        if: failure() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        continue-on-error: true
        shell: solaris {0}
        run: ls -l TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary

