name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      enabled_targets:
        description: >-
          Comma-separated list of targets to run (leave empty for the default set).
          Valid IDs: linux-x64, linux-arm64, linux-x64-scalar, linux-arm64-scalar,
          windows-x64, windows-2022, macos-arm64, macos-x64, linux-arm32, linux-powerpc64-be,
          freebsd, solaris, netbsd, dragonflybsd
        default: ""
        type: string
      debug:
        description: Verbose install tracing (CI_DEBUG=1 in install-fpc-lazarus.sh)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FPC_VERSION: 3.2.2
  LAZARUS_BRANCH: lazarus_4_4
  LAZARUS_REPO: https://github.com/fpc/Lazarus.git
  MAKE_BUILD_BACKEND: fpc
  # make.pas package build scope: 'all' compiles every discovered package (catches
  # a package that fails on the target even if unused); 'required' only compiles
  # the projects' dependency closure. Override per job below, like MAKE_BUILD_BACKEND.
  MAKE_PACKAGE_SCOPE: required
  # Space/comma/semicolon-separated conditional defines passed to every compile.
  # fpc backend: -dNAME per compile. lazbuild backend: injected into fpc.cfg so
  # the project and every recursive package rebuild inherit them. Override per job.
  # Examples:
  #   single:   MAKE_DEFINES: WITH_GTK2_IM
  #   multiple: MAKE_DEFINES: 'WITH_GTK2_IM DEBUG_LOG USE_CTHREADS'
  MAKE_DEFINES: ''
  # When true, make.pas builds and runs console benchmarks after the test suite.
  # Override per job below, like MAKE_BUILD_BACKEND.
  MAKE_RUN_BENCHMARK: false
  # How many times a job runs the unit suite in one process (the test binary's --repeat). Above 1
  # a run that leaves state behind for the next fails the leg. Override per job below, like
  # MAKE_BUILD_BACKEND.
  MAKE_TEST_REPEAT: 1
  # When true (default), every native, scalar and VM job runs the interop harness after its build
  # (the emulated QEMU legs do not): the loopback self-test, the two-tier structure-aware parser
  # fuzzer (regression-corpus replay + a fixed-seed mutation smoke), and the always-on openssl
  # s_client/s_server matrix. Read by that job's interop step. Set false to skip the whole harness.
  MAKE_RUN_INTEROP: true
  # When true (default), the interop step additionally runs the full-suite hard-gate BoGo
  # conformance run (needs Go + the BOGO_REF-pinned BoringSSL checkout, set up in the harness
  # jobs only when this is on). This is the whole-suite gate, not the old allowlist: every
  # test must PASS or match a disable-ledger glob, else the leg fails - so the gate blocks
  # regressions on push / PR / schedule. The toggle is retained (set false to turn the heavy
  # leg off without editing workflow structure), it just defaults on.
  MAKE_RUN_BOGO: true
  # When true (default), the interop step runs the openssl s_client/s_server matrix. It is
  # capability-guarded: run-openssl-matrix.sh self-skips (never fails the leg) unless a real
  # OpenSSL >= 3.x is available. So every platform can share this one toggle instead of a
  # per-job override.
  MAKE_RUN_OPENSSL: true
  # When true (default), the interop step runs the native-trust cells: the portable verifier
  # against a per-run generated CA on every native, scalar and VM leg, plus - on Windows/macOS - the
  # OS trust delegate against a throwaway root installed into the machine store. Set false to skip.
  MAKE_RUN_TRUST: true
  # When true, the Windows github-hosted legs also run the informational root auto-update probe
  # (it removes one public root from the machine stores and restores it). Default false: it answered
  # its question; the probe stays available for re-checking after a Windows image change.
  MAKE_RUN_AUTOROOT: false
  # When true (default), the native, scalar and VM legs (not DragonFly) compile the fcl-net adapter package
  # + its six examples against the prebuilt packages and run its four in-process loopback examples (no
  # network; the real-world example is compile-only, the wedge demo compile-only). fcl-net ships in the
  # FPC tarball, so this needs no extra deps; the other three adapters need third-party frameworks CI
  # does not install and stay out of scope. Read by that job's fclnet-build.sh step. Set false to skip.
  MAKE_RUN_FCLNET: true
  # The crypto and PKIX providers the interop harness (self-test, fuzzer, openssl matrix and BoGo)
  # and the Windows unit-suite reruns use (TLSLIB_CRYPTO_PROVIDER / TLSLIB_PKIX_PROVIDER): portable,
  # or os for this platform's native facets overlaid on the portable base. Only Windows has native
  # crypto facets today, so os equals portable elsewhere, and PKIX has no os provider yet. With
  # both portable the rerun is skipped.
  MAKE_CRYPTO_PROVIDER: os
  MAKE_PKIX_PROVIDER: portable
  # When true (default), the native, scalar and VM legs also run the unit tests that need live DNS
  # (TLSLIB_TEST_NETWORK). Set false to skip them.
  MAKE_TEST_NETWORK: true
  # The BoringSSL/BoGo peer commit the disable ledger is reconciled against (pins the
  # peer). Bumping it is a deliberate, reviewed change: any new test it introduces
  # surfaces as UNEXPECTED and must be triaged into pass/disable - the gate working.
  BOGO_REF: ae49d2681a56ca7b8609f6039a770fda2a8eb550
  # When true, make.pas builds (never runs) LCL/GUI projects. Only meaningful under
  # the lazbuild backend - the fpc backend has no widgetset and always skips them.
  # Set false to opt out of the per-platform GUI widgetset toolchain (GTK2/X11 on
  # Unix, cocoa on macOS). Override per job below, like MAKE_BUILD_BACKEND.
  MAKE_LAZBUILD_GUI: false
  # Set by the workflow_dispatch "debug" toggle; '1' enables `set -x` tracing in
  # install-fpc-lazarus.sh, '0' otherwise. Forwarded into the sandboxed jobs below.
  CI_DEBUG: ${{ github.event.inputs.debug == 'true' && '1' || '0' }}

jobs:

  setup:
    name: Resolve target list
    runs-on: ubuntu-latest
    outputs:
      enabled_targets: ${{ steps.resolve.outputs.enabled_targets }}
      target_map: ${{ steps.resolve.outputs.target_map }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve enabled targets
        id: resolve
        shell: bash
        env:
          INPUT_TARGETS: ${{ github.event.inputs.enabled_targets }}
        run: bash .github/workflows/ci/resolve-targets.sh

  # Fast source linters, gated between target resolution and the build matrix so a
  # lint failure blocks the whole run before any expensive leg starts. Three separate
  # scripts (kept apart for clarity) under one job; each later one runs even if an earlier
  # one fails, so all the linters' findings surface in a single pass.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: GUID lint (duplicate interface IIDs)
        run: bash .github/workflows/ci/lint/guid-lint.sh
      - name: Comment lint (production comments)
        if: ${{ !cancelled() }}
        run: bash .github/workflows/ci/lint/comment-lint.sh
      - name: Teardown lint (bare field frees in test TearDown)
        if: ${{ !cancelled() }}
        run: bash .github/workflows/ci/lint/teardown-lint.sh

  # Native targets are standalone jobs (one per target) rather than a single
  # matrix job, so each can carry its own env overrides and so a single-target
  # workflow_dispatch cleanly skips the rest. Like the QEMU/VM jobs below, they
  # gate via `if: contains(... enabled_targets ...)` and resolve runner/fpc_target
  # from target_map. Keep `name:` literal: an if-skipped job renders an
  # unevaluated name expression in the UI, so it cannot be sourced from JSON.
  linux-x64:
    name: "Native: Linux x86_64"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',linux-x64,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      # FclNet adapter: compile the fcl-net adapter + examples and run its loopbacks (no deps
      # beyond the FPC tarball). Runs after Build so the packages are already compiled.
      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      # Interop harness (self-test + fuzzer + openssl matrix + the hard-gate BoGo run):
      # provisions Go + the pinned peer and archives the coverage boundary. Shared by every
      # native job via the composite action. Opt out with MAKE_RUN_INTEROP=false, or of BoGo
      # alone with MAKE_RUN_BOGO=false.
      - name: Interop harness
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64'].fpc_target }}
          artifact-suffix: linux-x64
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}
          bogo-ref: ${{ env.BOGO_REF }}

  linux-arm64:
    name: "Native: Linux AArch64"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',linux-arm64,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      # FclNet adapter: compile the fcl-net adapter + examples and run its loopbacks (no deps
      # beyond the FPC tarball). Runs after Build so the packages are already compiled.
      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      # Interop harness on native AArch64 (architecture-generic; the hard-gate BoGo run
      # runs here too when MAKE_RUN_BOGO=true) via the shared composite action.
      - name: Interop harness
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64'].fpc_target }}
          artifact-suffix: linux-arm64
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}
          bogo-ref: ${{ env.BOGO_REF }}

  # Scalar-dispatch legs: same native targets, but MAKE_DEFINES
  # forces CRYPTOLIB_FORCE_SCALAR so the SIMD-bearing
  # arches exercise the scalar fallbacks instead.
  linux-x64-scalar:
    name: "Native: Linux x86_64 (FORCE_SCALAR)"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64-scalar'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',linux-x64-scalar,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64-scalar'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64-scalar'].fpc_tarball_target }}
          MAKE_DEFINES: 'CRYPTOLIB_FORCE_SCALAR HASHLIB_FORCE_SCALAR'
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64-scalar'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      - name: Interop harness
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['linux-x64-scalar'].fpc_target }}
          artifact-suffix: linux-x64-scalar
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}
          bogo-ref: ${{ env.BOGO_REF }}

  linux-arm64-scalar:
    name: "Native: Linux AArch64 (FORCE_SCALAR)"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64-scalar'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',linux-arm64-scalar,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64-scalar'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64-scalar'].fpc_tarball_target }}
          MAKE_DEFINES: 'CRYPTOLIB_FORCE_SCALAR HASHLIB_FORCE_SCALAR'
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64-scalar'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      - name: Interop harness
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm64-scalar'].fpc_target }}
          artifact-suffix: linux-arm64-scalar
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}
          bogo-ref: ${{ env.BOGO_REF }}

  windows-x64:
    name: "Native: Windows x86_64"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['windows-x64'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',windows-x64,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      # The exact Windows build, to compare with the validated builds in the module certificate;
      # informational, so a failure here never fails the leg.
      - name: OS build info
        continue-on-error: true
        shell: bash
        run: bash .github/workflows/ci/os-build-info.sh

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['windows-x64'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['windows-x64'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      # The Build step runs the unit suites on the portable providers. When a non-portable
      # provider is selected, run them again on it with the binary Build just produced.
      - name: Unit suites (selected providers)
        if: env.MAKE_CRYPTO_PROVIDER != 'portable' || env.MAKE_PKIX_PROVIDER != 'portable'
        shell: bash
        env:
          TLSLIB_CRYPTO_PROVIDER: ${{ env.MAKE_CRYPTO_PROVIDER }}
          TLSLIB_PKIX_PROVIDER: ${{ env.MAKE_PKIX_PROVIDER }}
        run: bash .github/workflows/ci/provider-suites.sh

      # FclNet adapter: compile the fcl-net adapter + examples and run its loopbacks (no deps
      # beyond the FPC tarball). Runs after Build so the packages are already compiled.
      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['windows-x64'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      # Same gating as the other native legs: the harness follows MAKE_RUN_INTEROP, BoGo follows MAKE_RUN_BOGO.
      - name: Interop harness (BoGo)
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['windows-x64'].fpc_target }}
          artifact-suffix: windows-x64
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}
          bogo-ref: ${{ env.BOGO_REF }}

  # Sets TLSLIB_EXPECT_VALIDATED_MODULE, which makes the tests require the validated module, on
  # the windows-2022 runner image only; the other Windows images leave it unset.
  windows-2022:
    name: "Native: Windows Server 2022"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['windows-2022'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',windows-2022,')
    env:
      TLSLIB_EXPECT_VALIDATED_MODULE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      # The exact Windows build, to compare with the validated builds in the module certificate;
      # informational, so a failure here never fails the leg.
      - name: OS build info
        continue-on-error: true
        shell: bash
        run: bash .github/workflows/ci/os-build-info.sh

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['windows-2022'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['windows-2022'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      # The Build step runs the unit suites on the portable providers. When a non-portable
      # provider is selected, run them again on it with the binary Build just produced.
      - name: Unit suites (selected providers)
        if: env.MAKE_CRYPTO_PROVIDER != 'portable' || env.MAKE_PKIX_PROVIDER != 'portable'
        shell: bash
        env:
          TLSLIB_CRYPTO_PROVIDER: ${{ env.MAKE_CRYPTO_PROVIDER }}
          TLSLIB_PKIX_PROVIDER: ${{ env.MAKE_PKIX_PROVIDER }}
        run: bash .github/workflows/ci/provider-suites.sh

      # FclNet adapter: compile the fcl-net adapter + examples and run its loopbacks (no deps
      # beyond the FPC tarball). Runs after Build so the packages are already compiled.
      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['windows-2022'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      # Same gating as the other native legs: the harness follows MAKE_RUN_INTEROP, BoGo follows MAKE_RUN_BOGO.
      - name: Interop harness (BoGo)
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['windows-2022'].fpc_target }}
          artifact-suffix: windows-2022
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}
          bogo-ref: ${{ env.BOGO_REF }}

  macos-arm64:
    name: "Native: macOS AArch64 (Apple Silicon)"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['macos-arm64'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',macos-arm64,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['macos-arm64'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['macos-arm64'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      # FclNet adapter: compile the fcl-net adapter + examples and run its loopbacks (no deps
      # beyond the FPC tarball). Runs after Build so the packages are already compiled. macOS also
      # exercises the Darwin SO_NOSIGPIPE send path, which only runs here.
      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['macos-arm64'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      # Interop harness (self-test + fuzzer + openssl matrix + BoGo hard gate) as on Linux.
      # The openssl matrix runs against Homebrew's openssl@3 (the runner's system openssl is
      # LibreSSL): run-openssl-matrix.sh prefers it and self-skips if it is somehow absent.
      - name: Interop harness
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['macos-arm64'].fpc_target }}
          artifact-suffix: macos-arm64
          bogo-ref: ${{ env.BOGO_REF }}
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}

  macos-x64:
    name: "Native: macOS x86_64 (Intel)"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['macos-x64'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',macos-x64,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['macos-x64'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['macos-x64'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        run: bash .github/workflows/ci/native-build.sh

      # FclNet adapter: compile the fcl-net adapter + examples and run its loopbacks (no deps
      # beyond the FPC tarball). Runs after Build so the packages are already compiled. macOS also
      # exercises the Darwin SO_NOSIGPIPE send path, which only runs here.
      - name: FclNet adapter (build + loopback)
        shell: bash
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['macos-x64'].fpc_target }}
          MAKE_RUN_FCLNET: ${{ env.MAKE_RUN_FCLNET }}
        run: bash .github/workflows/ci/adapters/fclnet-build.sh

      - name: Interop harness
        uses: ./.github/workflows/ci/interop/interop-harness
        with:
          fpc-target: ${{ fromJSON(needs.setup.outputs.target_map)['macos-x64'].fpc_target }}
          artifact-suffix: macos-x64
          bogo-ref: ${{ env.BOGO_REF }}
          run-interop: ${{ env.MAKE_RUN_INTEROP }}
          run-bogo: ${{ env.MAKE_RUN_BOGO }}
          run-openssl: ${{ env.MAKE_RUN_OPENSSL }}
          crypto-provider: ${{ env.MAKE_CRYPTO_PROVIDER }}
          pkix-provider: ${{ env.MAKE_PKIX_PROVIDER }}
          run-trust: ${{ env.MAKE_RUN_TRUST }}
          run-autoroot: ${{ env.MAKE_RUN_AUTOROOT }}

  linux-arm32:
    name: "QEMU: Linux ARMv7"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm32'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',linux-arm32,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build (ARMv7 via QEMU user-mode)
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: armv7
          distro: ubuntu24.04
          env: |
            FPC_VERSION: ${{ env.FPC_VERSION }}
            FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm32'].fpc_target }}
            FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-arm32'].fpc_tarball_target }}
            LAZARUS_BRANCH: ${{ env.LAZARUS_BRANCH }}
            LAZARUS_REPO: ${{ env.LAZARUS_REPO }}
            MAKE_BUILD_BACKEND: ${{ env.MAKE_BUILD_BACKEND }}
            MAKE_PACKAGE_SCOPE: ${{ env.MAKE_PACKAGE_SCOPE }}
            MAKE_DEFINES: "${{ env.MAKE_DEFINES }}"
            MAKE_RUN_BENCHMARK: ${{ env.MAKE_RUN_BENCHMARK }}
            MAKE_TEST_REPEAT: ${{ env.MAKE_TEST_REPEAT }}
            MAKE_LAZBUILD_GUI: ${{ env.MAKE_LAZBUILD_GUI }}
            CI_DEBUG: ${{ env.CI_DEBUG }}
          run: bash .github/workflows/ci/arm32-run.sh

  linux-powerpc64-be:
    name: "QEMU: Linux PowerPC64 BE"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['linux-powerpc64-be'].runner }}
    timeout-minutes: 180
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',linux-powerpc64-be,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Set up QEMU (ppc64 big-endian)
        run: bash .github/workflows/ci/ppc64-qemu-setup.sh

      - name: Build (PowerPC64 BE via QEMU)
        env:
          FPC_VERSION: ${{ env.FPC_VERSION }}
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-powerpc64-be'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['linux-powerpc64-be'].fpc_tarball_target }}
          MAKE_BUILD_BACKEND: ${{ env.MAKE_BUILD_BACKEND }}
          MAKE_PACKAGE_SCOPE: ${{ env.MAKE_PACKAGE_SCOPE }}
          MAKE_DEFINES: ${{ env.MAKE_DEFINES }}
          MAKE_RUN_BENCHMARK: ${{ env.MAKE_RUN_BENCHMARK }}
          MAKE_TEST_REPEAT: ${{ env.MAKE_TEST_REPEAT }}
          MAKE_LAZBUILD_GUI: ${{ env.MAKE_LAZBUILD_GUI }}
        run: bash .github/workflows/ci/ppc64-be-build.sh

  freebsd:
    name: "VM: FreeBSD x86_64"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['freebsd'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',freebsd,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build (FreeBSD x86_64)
        uses: vmactions/freebsd-vm@v1
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['freebsd'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['freebsd'].fpc_tarball_target }}
          FREEBSD_INSTALL_MODE: interim
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        with:
          envs: FPC_VERSION FPC_TARGET FPC_TARBALL_TARGET LAZARUS_BRANCH LAZARUS_REPO MAKE_BUILD_BACKEND MAKE_PACKAGE_SCOPE MAKE_DEFINES MAKE_RUN_BENCHMARK MAKE_TEST_REPEAT MAKE_LAZBUILD_GUI FREEBSD_INSTALL_MODE CI_DEBUG MAKE_RUN_INTEROP MAKE_RUN_BOGO MAKE_RUN_OPENSSL MAKE_RUN_TRUST MAKE_RUN_AUTOROOT MAKE_RUN_FCLNET MAKE_CRYPTO_PROVIDER MAKE_PKIX_PROVIDER TLSLIB_TEST_NETWORK BOGO_REF
          release: "15.0"
          prepare: sh .github/workflows/ci/vm-freebsd-prepare.sh
          run: bash .github/workflows/ci/vm-freebsd-run.sh

      # a failed run is not copied back, so pull the files out of the VM, which is still up
      - name: Pull BoGo coverage boundary from the VM
        if: failure() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        continue-on-error: true
        shell: freebsd {0}
        run: ls -l TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary

      - name: Upload BoGo coverage boundary
        if: always() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bogo-coverage-boundary-freebsd
          path: TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary
          if-no-files-found: warn

  netbsd:
    name: "VM: NetBSD x86_64"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['netbsd'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',netbsd,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build (NetBSD x86_64)
        uses: vmactions/netbsd-vm@v1
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['netbsd'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['netbsd'].fpc_tarball_target }}
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
        with:
          envs: FPC_VERSION LAZARUS_BRANCH LAZARUS_REPO MAKE_BUILD_BACKEND MAKE_PACKAGE_SCOPE MAKE_RUN_BENCHMARK MAKE_TEST_REPEAT MAKE_LAZBUILD_GUI FPC_TARGET FPC_TARBALL_TARGET CI_DEBUG MAKE_RUN_INTEROP MAKE_RUN_BOGO MAKE_RUN_OPENSSL MAKE_RUN_TRUST MAKE_RUN_AUTOROOT MAKE_RUN_FCLNET MAKE_CRYPTO_PROVIDER MAKE_PKIX_PROVIDER TLSLIB_TEST_NETWORK BOGO_REF
          prepare: sh .github/workflows/ci/vm-netbsd-prepare.sh
          run: bash .github/workflows/ci/vm-run-shared.sh

      - name: Pull BoGo coverage boundary from the VM
        if: failure() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        continue-on-error: true
        shell: netbsd {0}
        run: ls -l TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary

      - name: Upload BoGo coverage boundary
        if: always() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bogo-coverage-boundary-netbsd
          path: TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary
          if-no-files-found: warn

  dragonflybsd:
    name: "VM: DragonFlyBSD x86_64"
    runs-on: ${{ fromJSON(needs.setup.outputs.target_map)['dragonflybsd'].runner }}
    timeout-minutes: 120
    needs: [setup, lint]
    if: contains(format(',{0},', needs.setup.outputs.enabled_targets), ',dragonflybsd,')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Build (DragonFlyBSD x86_64)
        uses: vmactions/dragonflybsd-vm@v1
        env:
          FPC_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['dragonflybsd'].fpc_target }}
          FPC_TARBALL_TARGET: ${{ fromJSON(needs.setup.outputs.target_map)['dragonflybsd'].fpc_tarball_target }}
          LD_LIBRARY_PATH_EXTRA: /usr/local/lib
          TLSLIB_TEST_NETWORK: ${{ env.MAKE_TEST_NETWORK }}
          # the FclNet loopback does not run on this OS
          MAKE_RUN_FCLNET: false
        with:
          envs: FPC_VERSION LAZARUS_BRANCH LAZARUS_REPO MAKE_BUILD_BACKEND MAKE_PACKAGE_SCOPE MAKE_RUN_BENCHMARK MAKE_TEST_REPEAT MAKE_LAZBUILD_GUI FPC_TARGET FPC_TARBALL_TARGET LD_LIBRARY_PATH_EXTRA CI_DEBUG MAKE_RUN_INTEROP MAKE_RUN_BOGO MAKE_RUN_OPENSSL MAKE_RUN_TRUST MAKE_RUN_AUTOROOT MAKE_RUN_FCLNET MAKE_CRYPTO_PROVIDER MAKE_PKIX_PROVIDER TLSLIB_TEST_NETWORK BOGO_REF
          prepare: sh .github/workflows/ci/vm-dragonfly-prepare.sh
          run: bash .github/workflows/ci/vm-run-shared.sh

      - name: Pull BoGo coverage boundary from the VM
        if: failure() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        continue-on-error: true
        shell: dragonflybsd {0}
        run: ls -l TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary

      - name: Upload BoGo coverage boundary
        if: always() && env.MAKE_RUN_INTEROP == 'true' && env.MAKE_RUN_BOGO == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bogo-coverage-boundary-dragonflybsd
          path: TlsLib.Interop/FreePascal.Interop/bin/bogo-boundary
          if-no-files-found: warn

  solaris:
